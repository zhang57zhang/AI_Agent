[project]
name = "opencode-agent"
version = "0.1.0"
description = "OpenCode-like AI Coding Agent - Terminal TUI with MCP, LSP, multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "AI Agent Team"}]

dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "textual>=0.80.0",
    "rich>=13.7.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "watchfiles>=0.24.0",
    "gitpython>=3.1.43",
    "pygls>=2.0.0",
    "mcp>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "textual-dev>=1.6.0",
]

[project.scripts]
opencode-agent = "opencode_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencode_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]